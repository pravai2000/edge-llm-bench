[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edgebench"
version = "0.1.0"
description = "Config-driven quantization benchmark harness: latency, power and accuracy for small LLMs on edge devices"
requires-python = ">=3.9"
dependencies = ["pyyaml", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
edgebench-run = "edgebench.run:main"
edgebench-report = "edgebench.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
